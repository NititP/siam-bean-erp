[project]
name = "siam-bean-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.151.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.4",
    "supabase>=2.33.0",
]

[dependency-groups]
dev = [
    "filelock>=4.2.4",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
